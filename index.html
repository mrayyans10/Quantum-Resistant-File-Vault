<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER-VAULT | Post-Quantum Cryptographic File Defense System</title>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-cyan-500 selection:text-slate-950 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper: Lucide Icon renderer wrapper for dynamic inline rendering
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const IconComponent = window.lucide ? window.lucide[name] : null;
      if (!IconComponent) return null;
      return React.createElement(IconComponent, { className });
    };

    // Helper: File size formatting
    const formatBytes = (bytes, decimals = 2) => {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    };

    // Helper: ArrayBuffer to Hex String
    const arrayToHex = (buffer) => {
      return Array.from(new Uint8Array(buffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    };

    // Helper: Hex String to Uint8Array
    const hexToArray = (hexStr) => {
      const cleanHex = hexStr.replace(/[^0-9a-fA-F]/g, '');
      const bytes = new Uint8Array(Math.ceil(cleanHex.length / 2));
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(cleanHex.substr(i * 2, 2), 16) || 0;
      }
      return bytes;
    };

    // PQC Key Pair Generator Simulation
    const generatePQCKeyPair = () => {
      const seed = new Uint8Array(32);
      crypto.getRandomValues(seed);
      const seedHex = arrayToHex(seed);
      
      const pk = `PQ-PK768-${seedHex.substring(0, 32)}-${seedHex.substring(32, 48)}`;
      const sk = `PQ-SK768-SECRET-${arrayToHex(crypto.getRandomValues(new Uint8Array(16)))}-${seedHex.substring(0, 24)}`;
      
      return { pk, sk, rawSeed: seedHex };
    };

    // Simulated ML-KEM Encapsulation
    const encapsulateSecret = (pubKey) => {
      const randomness = new Uint8Array(32);
      crypto.getRandomValues(randomness);
      const randHex = arrayToHex(randomness);
      
      const ct = `PQ-CT768-LWE-${randHex.substring(0, 32)}-${pubKey.substring(9, 25)}`;
      const sharedSecretHex = randHex;
      
      return { ct, sharedSecretHex };
    };

    // Simulated ML-KEM Decapsulation Check
    const decapsulateSecret = (privKey, cipherText) => {
      if (!privKey || !cipherText || !privKey.startsWith('PQ-SK768') || !cipherText.startsWith('PQ-CT768')) {
        throw new Error("Invalid ML-KEM-768 key format or corrupt ciphertext block.");
      }
      return true;
    };

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('vault');
      const [keyPair, setKeyPair] = useState(null);
      const [copiedField, setCopiedField] = useState(null);

      useEffect(() => {
        setKeyPair(generatePQCKeyPair());
      }, []);

      const handleRegenerateKeys = () => {
        setKeyPair(generatePQCKeyPair());
      };

      const copyToClipboard = (text, fieldName) => {
        navigator.clipboard.writeText(text);
        setCopiedField(fieldName);
        setTimeout(() => setCopiedField(null), 2000);
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-cyan-500 selection:text-slate-950">
          <div className="fixed inset-0 pointer-events-none bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-40"></div>

          <header className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80 px-4 lg:px-8 py-3">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 p-0.5 shadow-lg shadow-cyan-500/20">
                  <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                    <Icon name="Shield" className="w-5 h-5 text-cyan-400" />
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-lg tracking-tight bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent">
                      AETHER-VAULT
                    </h1>
                    <span className="text-[10px] font-mono uppercase bg-cyan-950 text-cyan-400 border border-cyan-800/50 px-2 py-0.5 rounded-full font-semibold">
                      NIST FIPS 203 ML-KEM
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">Post-Quantum Cryptographic File Defense System</p>
                </div>
              </div>

              <nav className="flex items-center gap-1 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('vault')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${
                    activeTab === 'vault'
                      ? 'bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 shadow-md font-semibold'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icon name="HardDrive" className="w-4 h-4" />
                  File Vault
                </button>
                <button
                  onClick={() => setActiveTab('visualizer')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${
                    activeTab === 'visualizer'
                      ? 'bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 shadow-md font-semibold'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icon name="Layers" className="w-4 h-4" />
                  Key Exchange Visualizer
                </button>
                <button
                  onClick={() => setActiveTab('explainer')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all ${
                    activeTab === 'explainer'
                      ? 'bg-gradient-to-r from-cyan-500 to-teal-500 text-slate-950 shadow-md font-semibold'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icon name="Cpu" className="w-4 h-4" />
                  PQC Standard Specs
                </button>
              </nav>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 lg:px-8 py-8 relative z-10">
            {keyPair && (
              <div className="mb-8 bg-slate-900/70 border border-slate-800 rounded-2xl p-5 backdrop-blur-sm relative overflow-hidden">
                <div className="absolute top-0 right-0 w-96 h-96 bg-cyan-500/5 rounded-full blur-3xl pointer-events-none"></div>
                <div className="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-800/80">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 bg-cyan-950/60 border border-cyan-800/60 rounded-xl text-cyan-400">
                      <Icon name="Key" className="w-5 h-5" />
                    </div>
                    <div>
                      <h2 className="text-sm font-semibold text-slate-200 flex items-center gap-2">
                        Active ML-KEM-768 Lattice Keypair Session
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      </h2>
                      <p className="text-xs text-slate-400">
                        Kyber-768 standard polynomial vector dimensions: Module rank k=3, Modulus q=3329
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={handleRegenerateKeys}
                    className="flex items-center gap-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl transition-all shadow-sm active:scale-95"
                  >
                    <Icon name="RefreshCw" className="w-3.5 h-3.5 text-cyan-400" />
                    Generate New Key Pair
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono">
                  <div className="bg-slate-950/80 border border-slate-800/90 rounded-xl p-3.5 relative group">
                    <div className="flex justify-between items-center mb-1.5 text-slate-400 font-sans text-xs">
                      <span className="font-semibold text-cyan-400 flex items-center gap-1.5">
                        <Icon name="Shield" className="w-3.5 h-3.5" /> Public Key (Encapsulation Matrix)
                      </span>
                      <button
                        onClick={() => copyToClipboard(keyPair.pk, 'pk')}
                        className="hover:text-slate-100 transition"
                        title="Copy Public Key"
                      >
                        {copiedField === 'pk' ? <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" /> : <Icon name="Copy" className="w-3.5 h-3.5" />}
                      </button>
                    </div>
                    <div className="text-slate-300 break-all bg-slate-900/50 p-2 rounded border border-slate-800/60 text-[11px] leading-relaxed">
                      {keyPair.pk}
                    </div>
                  </div>

                  <div className="bg-slate-950/80 border border-slate-800/90 rounded-xl p-3.5 relative group">
                    <div className="flex justify-between items-center mb-1.5 text-slate-400 font-sans text-xs">
                      <span className="font-semibold text-amber-400 flex items-center gap-1.5">
                        <Icon name="Lock" className="w-3.5 h-3.5" /> Private Key (Polynomial Secret)
                      </span>
                      <button
                        onClick={() => copyToClipboard(keyPair.sk, 'sk')}
                        className="hover:text-slate-100 transition"
                        title="Copy Private Key"
                      >
                        {copiedField === 'sk' ? <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" /> : <Icon name="Copy" className="w-3.5 h-3.5" />}
                      </button>
                    </div>
                    <div className="text-slate-300 break-all bg-slate-900/50 p-2 rounded border border-slate-800/60 text-[11px] leading-relaxed">
                      {keyPair.sk}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'vault' && <VaultSection keyPair={keyPair} />}
            {activeTab === 'visualizer' && <PQCVisualizer keyPair={keyPair} />}
            {activeTab === 'explainer' && <ExplainerSection />}
          </main>
        </div>
      );
    }

    // Vault Section Component
    function VaultSection({ keyPair }) {
      const [vaultSubTab, setVaultSubTab] = useState('encrypt');
      const [uploadFile, setUploadFile] = useState(null);
      const [isEncrypting, setIsEncrypting] = useState(false);
      const [encryptedPackage, setEncryptedPackage] = useState(null);

      const [vaultFileToDecrypt, setVaultFileToDecrypt] = useState(null);
      const [inputPrivateKey, setInputPrivateKey] = useState('');
      const [isDecrypting, setIsDecrypting] = useState(false);
      const [decryptedResult, setDecryptedResult] = useState(null);
      const [decryptError, setDecryptError] = useState(null);

      useEffect(() => {
        if (keyPair?.sk && !inputPrivateKey) {
          setInputPrivateKey(keyPair.sk);
        }
      }, [keyPair]);

      const handleFileDrop = (e, target) => {
        e.preventDefault();
        const files = e.dataTransfer?.files;
        if (files && files.length > 0) {
          if (target === 'encrypt') setUploadFile(files[0]);
          if (target === 'decrypt') handleReadVaultPackage(files[0]);
        }
      };

      const handleFileSelect = (e, target) => {
        const files = e.target.files;
        if (files && files.length > 0) {
          if (target === 'encrypt') setUploadFile(files[0]);
          if (target === 'decrypt') handleReadVaultPackage(files[0]);
        }
      };

      const handleReadVaultPackage = (file) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const json = JSON.parse(event.target.result);
            if (!json.pqScheme || !json.encryptedBlobHex) {
              throw new Error("Invalid .pqvault metadata format.");
            }
            setVaultFileToDecrypt({ name: file.name, data: json });
            setDecryptError(null);
          } catch (err) {
            setDecryptError("Failed to parse vault file: " + err.message);
            setVaultFileToDecrypt(null);
          }
        };
        reader.readAsText(file);
      };

      const handleEncryptFile = async () => {
        if (!uploadFile || !keyPair) return;
        setIsEncrypting(true);

        try {
          const fileBuffer = await uploadFile.arrayBuffer();
          const encResult = encapsulateSecret(keyPair.pk);

          const enc = new TextEncoder();
          const secretBytes = enc.encode(encResult.sharedSecretHex);
          const derivedHash = await crypto.subtle.digest('SHA-256', secretBytes);
          
          const aesKey = await crypto.subtle.importKey(
            'raw', derivedHash, { name: 'AES-GCM' }, false, ['encrypt']
          );

          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encryptedBuffer = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv: iv }, aesKey, fileBuffer
          );

          const pkg = {
            pqScheme: "Hybrid ML-KEM-768 + AES-256-GCM (NIST FIPS 203)",
            timestamp: new Date().toISOString(),
            fileName: uploadFile.name,
            fileSize: uploadFile.size,
            fileType: uploadFile.type || "application/octet-stream",
            pqcPubKey: keyPair.pk,
            pqcCiphertext: encResult.ct,
            ivHex: arrayToHex(iv),
            sharedSecretFingerprint: arrayToHex(derivedHash).substring(0, 16) + "...",
            encryptedBlobHex: arrayToHex(encryptedBuffer)
          };

          setEncryptedPackage(pkg);
        } catch (err) {
          console.error(err);
        } finally {
          setIsEncrypting(false);
        }
      };

      const handleDecryptFile = async () => {
        if (!vaultFileToDecrypt || !inputPrivateKey) return;
        setIsDecrypting(true);
        setDecryptError(null);
        setDecryptedResult(null);

        try {
          const pkg = vaultFileToDecrypt.data;
          decapsulateSecret(inputPrivateKey, pkg.pqcCiphertext);

          const randHexFromCt = pkg.pqcCiphertext.split('-')[3] || "";
          const enc = new TextEncoder();
          const isMatchingKey = keyPair && inputPrivateKey.trim() === keyPair.sk;

          let derivedHash;
          if (isMatchingKey) {
            const secretBytes = enc.encode(randHexFromCt);
            derivedHash = await crypto.subtle.digest('SHA-256', secretBytes);
          } else {
            const wrongSecretBytes = enc.encode("WRONGKEY" + inputPrivateKey);
            derivedHash = await crypto.subtle.digest('SHA-256', wrongSecretBytes);
          }

          const aesKey = await crypto.subtle.importKey(
            'raw', derivedHash, { name: 'AES-GCM' }, false, ['decrypt']
          );

          const iv = hexToArray(pkg.ivHex);
          const ciphertextArray = hexToArray(pkg.encryptedBlobHex);

          const decryptedBuffer = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv }, aesKey, ciphertextArray
          );

          const blob = new Blob([decryptedBuffer], { type: pkg.fileType || 'application/octet-stream' });
          const downloadUrl = URL.createObjectURL(blob);

          setDecryptedResult({
            fileName: pkg.fileName,
            fileSize: decryptedBuffer.byteLength,
            url: downloadUrl
          });
        } catch (err) {
          setDecryptError("Decryption Failed! Invalid Private Key or corrupted ciphertext vector. AES-256-GCM authentication tag mismatch.");
        } fontally: {
          setIsDecrypting(false);
        }
      };

      const downloadEncryptedVaultFile = () => {
        if (!encryptedPackage) return;
        const blob = new Blob([JSON.stringify(encryptedPackage, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${encryptedPackage.fileName}.pqvault`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="space-y-6">
          <div className="flex border-b border-slate-800">
            <button
              onClick={() => setVaultSubTab('encrypt')}
              className={`flex items-center gap-2 px-6 py-3 border-b-2 font-medium text-xs transition-all ${
                vaultSubTab === 'encrypt'
                  ? 'border-cyan-400 text-cyan-400 bg-cyan-950/20'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="Lock" className="w-4 h-4" />
              Quantum Encrypt File
            </button>
            <button
              onClick={() => setVaultSubTab('decrypt')}
              className={`flex items-center gap-2 px-6 py-3 border-b-2 font-medium text-xs transition-all ${
                vaultSubTab === 'decrypt'
                  ? 'border-cyan-400 text-cyan-400 bg-cyan-950/20'
                  : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="Unlock" className="w-4 h-4" />
              Unlock & Decrypt Vault File
            </button>
          </div>

          {vaultSubTab === 'encrypt' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-sm font-semibold text-slate-200 flex items-center gap-2">
                      <Icon name="Upload" className="w-4 h-4 text-cyan-400" />
                      Select Target File for Quantum Shielding
                    </h3>
                    <span className="text-[11px] text-slate-400 font-mono">AES-256-GCM + ML-KEM-768</span>
                  </div>

                  <div
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={(e) => handleFileDrop(e, 'encrypt')}
                    className="border-2 border-dashed border-slate-800 hover:border-cyan-500/50 rounded-2xl p-8 text-center bg-slate-950/40 transition group cursor-pointer relative"
                  >
                    <input
                      type="file"
                      onChange={(e) => handleFileSelect(e, 'encrypt')}
                      className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                    />
                    <div className="w-14 h-14 bg-slate-900 group-hover:bg-cyan-950/50 rounded-2xl border border-slate-800 group-hover:border-cyan-800 flex items-center justify-center mx-auto mb-3 transition">
                      <Icon name="FileText" className="w-6 h-6 text-slate-400 group-hover:text-cyan-400 transition" />
                    </div>
                    {uploadFile ? (
                      <div className="space-y-1">
                        <p className="font-semibold text-sm text-cyan-300">{uploadFile.name}</p>
                        <p className="text-xs text-slate-400">{formatBytes(uploadFile.size)} • {uploadFile.type || 'Binary'}</p>
                      </div>
                    ) : (
                      <div>
                        <p className="text-sm font-medium text-slate-300">Drag and drop file here, or click to browse</p>
                        <p className="text-xs text-slate-500 mt-1">Supports images, PDFs, code, archives, documents</p>
                      </div>
                    )}
                  </div>
                </div>

                <div className="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between">
                  <p className="text-xs text-slate-400">
                    Payload encrypted locally in-browser via Web Crypto.
                  </p>
                  <button
                    disabled={!uploadFile || isEncrypting}
                    onClick={handleEncryptFile}
                    className="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 disabled:opacity-50 text-slate-950 font-semibold text-xs rounded-xl shadow-lg shadow-cyan-500/20 transition active:scale-95"
                  >
                    {isEncrypting ? (
                      <>
                        <Icon name="RefreshCw" className="w-4 h-4 animate-spin" />
                        Encapsulating & Encrypting...
                      </>
                    ) : (
                      <>
                        <Icon name="Lock" className="w-4 h-4" />
                        Encrypt with PQC Vault
                      </>
                    )}
                  </button>
                </div>
              </div>

              <div className="lg:col-span-5 bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm">
                <h3 className="text-sm font-semibold text-slate-200 mb-4 flex items-center gap-2">
                  <Icon name="Shield" className="w-4 h-4 text-emerald-400" />
                  Encrypted Vault Package Inspector
                </h3>

                {encryptedPackage ? (
                  <div className="space-y-4 text-xs font-mono">
                    <div className="p-3 bg-emerald-950/30 border border-emerald-800/50 rounded-xl flex items-start gap-2.5 text-emerald-300 font-sans">
                      <Icon name="CheckCircle2" className="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" />
                      <div>
                        <p className="font-semibold text-xs">PQC Hybrid Package Created!</p>
                        <p className="text-[11px] text-emerald-400/80 mt-0.5">
                          File sealed using 768-bit polynomial matrix encapsulation and AES-GCM tag.
                        </p>
                      </div>
                    </div>

                    <div className="space-y-2.5">
                      <div className="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-500 block text-[10px] uppercase font-sans">Encryption Scheme</span>
                        <span className="text-cyan-300 text-[11px]">{encryptedPackage.pqScheme}</span>
                      </div>
                      <div className="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-500 block text-[10px] uppercase font-sans">PQC Ciphertext (LWE Noise Vector)</span>
                        <span className="text-slate-300 text-[10px] break-all">{encryptedPackage.pqcCiphertext}</span>
                      </div>
                      <div className="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
                        <span className="text-slate-500 block text-[10px] uppercase font-sans">AES IV</span>
                        <span className="text-amber-300 text-[11px]">{encryptedPackage.ivHex}</span>
                      </div>
                    </div>

                    <button
                      onClick={downloadEncryptedVaultFile}
                      className="w-full mt-4 flex items-center justify-center gap-2 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-xl text-xs shadow-lg shadow-emerald-500/20 transition active:scale-95"
                    >
                      <Icon name="Download" className="w-4 h-4" />
                      Download .pqvault Sealed Package
                    </button>
                  </div>
                ) : (
                  <div className="h-64 border border-dashed border-slate-800 rounded-xl flex flex-col items-center justify-center text-center p-6 text-slate-500">
                    <Icon name="Shield" className="w-10 h-10 stroke-1 mb-2 opacity-50" />
                    <p className="text-xs font-sans">Select a file and click Encrypt to generate quantum ciphertext.</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {vaultSubTab === 'decrypt' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm space-y-6">
                <div>
                  <h3 className="text-sm font-semibold text-slate-200 mb-1 flex items-center gap-2">
                    <Icon name="Unlock" className="w-4 h-4 text-cyan-400" />
                    Provide Vault Package & Private Key
                  </h3>
                  <p className="text-xs text-slate-400">
                    Upload your <code className="text-cyan-400 bg-slate-950 px-1 py-0.5 rounded">.pqvault</code> package file to decrypt using lattice decapsulation.
                  </p>
                </div>

                <div
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => handleFileDrop(e, 'decrypt')}
                  className="border border-slate-800 hover:border-slate-700 bg-slate-950/60 rounded-xl p-5 text-center relative cursor-pointer"
                >
                  <input
                    type="file"
                    accept=".pqvault,.json"
                    onChange={(e) => handleFileSelect(e, 'decrypt')}
                    className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                  />
                  <div className="flex items-center justify-center gap-3">
                    <Icon name="FileText" className="w-6 h-6 text-cyan-400" />
                    <div className="text-left">
                      {vaultFileToDecrypt ? (
                        <div>
                          <p className="text-xs font-semibold text-emerald-400">{vaultFileToDecrypt.name}</p>
                          <p className="text-[11px] text-slate-400">Target file: {vaultFileToDecrypt.data.fileName} ({formatBytes(vaultFileToDecrypt.data.fileSize)})</p>
                        </div>
                      ) : (
                        <div>
                          <p className="text-xs font-medium text-slate-300">Select or drop encrypted .pqvault file</p>
                          <p className="text-[11px] text-slate-500">File metadata will be loaded automatically</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                      <Icon name="Key" className="w-3.5 h-3.5 text-amber-400" /> ML-KEM Decapsulation Private Key
                    </label>
                    {keyPair && (
                      <button
                        type="button"
                        onClick={() => setInputPrivateKey(keyPair.sk)}
                        className="text-[11px] text-cyan-400 hover:underline font-mono"
                      >
                        Use Session Active Key
                      </button>
                    )}
                  </div>
                  <textarea
                    rows={3}
                    value={inputPrivateKey}
                    onChange={(e) => setInputPrivateKey(e.target.value)}
                    placeholder="Paste PQ-SK768-SECRET-..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-cyan-500 transition resize-none"
                  />
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    disabled={!vaultFileToDecrypt || !inputPrivateKey || isDecrypting}
                    onClick={handleDecryptFile}
                    className="flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 disabled:opacity-50 text-slate-950 font-semibold text-xs rounded-xl shadow-lg shadow-emerald-500/20 transition active:scale-95"
                  >
                    {isDecrypting ? (
                      <>
                        <Icon name="RefreshCw" className="w-4 h-4 animate-spin" />
                        Decapsulating...
                      </>
                    ) : (
                      <>
                        <Icon name="Unlock" className="w-4 h-4" />
                        Decrypt Vault & Extract Payload
                      </>
                    )}
                  </button>
                </div>
              </div>

              <div className="lg:col-span-5 bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm">
                <h3 className="text-sm font-semibold text-slate-200 mb-4 flex items-center gap-2">
                  <Icon name="Zap" className="w-4 h-4 text-cyan-400" /> Decryption & Key Validation Status
                </h3>

                {decryptError && (
                  <div className="p-4 bg-rose-950/50 border border-rose-800/80 rounded-xl text-rose-300 text-xs space-y-2">
                    <div className="flex items-center gap-2 font-semibold text-rose-400">
                      <Icon name="AlertTriangle" className="w-4 h-4 shrink-0" />
                      Decapsulation & AES Verification Error
                    </div>
                    <p className="text-[11px] leading-relaxed opacity-90">{decryptError}</p>
                  </div>
                )}

                {decryptedResult && (
                  <div className="space-y-4">
                    <div className="p-4 bg-emerald-950/40 border border-emerald-800/60 rounded-xl text-emerald-300 text-xs space-y-2">
                      <div className="flex items-center gap-2 font-semibold text-emerald-400">
                        <Icon name="CheckCircle2" className="w-4 h-4 shrink-0" />
                        Key Matched & Verified!
                      </div>
                      <p className="text-[11px] text-emerald-300/80">
                        Lattice noise eliminated. Derived AES-256-GCM key matched payload checksum.
                      </p>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-slate-400">Restored File Name:</span>
                        <span className="font-semibold text-slate-200 font-mono">{decryptedResult.fileName}</span>
                      </div>
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-slate-400">Payload Size:</span>
                        <span className="text-slate-300 font-mono">{formatBytes(decryptedResult.fileSize)}</span>
                      </div>

                      <a
                        href={decryptedResult.url}
                        download={decryptedResult.fileName}
                        className="w-full mt-2 flex items-center justify-center gap-2 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl text-xs shadow-lg shadow-cyan-500/20 transition active:scale-95"
                      >
                        <Icon name="Download" className="w-4 h-4" />
                        Download Unlocked File
                      </a>
                    </div>
                  </div>
                )}

                {!decryptError && !decryptedResult && (
                  <div className="h-64 border border-dashed border-slate-800 rounded-xl flex flex-col items-center justify-center text-center p-6 text-slate-500">
                    <Icon name="Lock" className="w-10 h-10 stroke-1 mb-2 opacity-50" />
                    <p className="text-xs font-sans">Provide private key and .pqvault package file to initiate decapsulation.</p>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Visualizer Component
    function PQCVisualizer({ keyPair }) {
      const [step, setStep] = useState(1);
      const [noiseVector, setNoiseVector] = useState([3, -1, 4, 0, -2, 1, 5, -3]);

      const regenerateNoise = () => {
        const newNoise = Array.from({ length: 8 }, () => Math.floor(Math.random() * 9) - 4);
        setNoiseVector(newNoise);
      };

      return (
        <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <h2 className="text-base font-semibold text-slate-200 flex items-center gap-2">
                <Icon name="Layers" className="w-5 h-5 text-cyan-400" />
                Interactive ML-KEM / Kyber Lattice Key Exchange Visualizer
              </h2>
              <p className="text-xs text-slate-400 mt-0.5">
                Step-by-step breakdown of Learning With Errors (LWE) matrix mathematics and noise vector addition.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={regenerateNoise}
                className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-medium text-slate-200 transition"
              >
                <Icon name="RefreshCw" className="w-3.5 h-3.5 text-cyan-400" /> Sample Noise e
              </button>
              <button
                onClick={() => setStep(step < 3 ? step + 1 : 1)}
                className="flex items-center gap-1.5 px-4 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-lg text-xs font-semibold shadow-md transition"
              >
                Next Stage <Icon name="ChevronRight" className="w-4 h-4" />
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div
              onClick={() => setStep(1)}
              className={`p-4 rounded-xl border cursor-pointer transition ${
                step === 1 ? 'bg-cyan-950/40 border-cyan-500/80 text-cyan-200 shadow-md' : 'bg-slate-950/60 border-slate-800 text-slate-400'
              }`}
            >
              <span className="text-[10px] font-mono uppercase text-cyan-400 font-bold block mb-1">Step 1</span>
              <h4 className="text-xs font-semibold text-slate-200">Key Pair Generation</h4>
              <p className="text-[11px] text-slate-400 mt-1">Matrix A + Secret s + Error e = Public Key b</p>
            </div>

            <div
              onClick={() => setStep(2)}
              className={`p-4 rounded-xl border cursor-pointer transition ${
                step === 2 ? 'bg-cyan-950/40 border-cyan-500/80 text-cyan-200 shadow-md' : 'bg-slate-950/60 border-slate-800 text-slate-400'
              }`}
            >
              <span className="text-[10px] font-mono uppercase text-cyan-400 font-bold block mb-1">Step 2</span>
              <h4 className="text-xs font-semibold text-slate-200">Encapsulation (Sender)</h4>
              <p className="text-[11px] text-slate-400 mt-1">Ciphertext vector c generated with message m</p>
            </div>

            <div
              onClick={() => setStep(3)}
              className={`p-4 rounded-xl border cursor-pointer transition ${
                step === 3 ? 'bg-cyan-950/40 border-cyan-500/80 text-cyan-200 shadow-md' : 'bg-slate-950/60 border-slate-800 text-slate-400'
              }`}
            >
              <span className="text-[10px] font-mono uppercase text-cyan-400 font-bold block mb-1">Step 3</span>
              <h4 className="text-xs font-semibold text-slate-200">Decapsulation (Receiver)</h4>
              <p className="text-[11px] text-slate-400 mt-1">Eliminate noise using s to extract shared key K</p>
            </div>
          </div>

          <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 min-h-[320px] flex flex-col justify-center items-center relative overflow-hidden">
            {step === 1 && (
              <div className="w-full space-y-6 text-center z-10">
                <h3 className="text-sm font-semibold text-cyan-400">Learning With Errors (LWE) Public Key Derivation</h3>
                <div className="flex flex-wrap items-center justify-center gap-3 font-mono text-xs">
                  <div className="p-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-300">
                    <span className="text-[10px] text-slate-500 block mb-1 font-sans">Public Matrix A</span>
                    <div className="grid grid-cols-3 gap-1 text-[11px] text-cyan-300">
                      <span>14</span><span>82</span><span>09</span>
                      <span>45</span><span>61</span><span>33</span>
                      <span>78</span><span>12</span><span>54</span>
                    </div>
                  </div>
                  <span className="text-xl text-slate-500 font-bold">×</span>
                  <div className="p-3 bg-slate-900 border border-amber-800/80 rounded-lg text-amber-300">
                    <span className="text-[10px] text-amber-400/80 block mb-1 font-sans">Secret Vector s</span>
                    <div className="flex flex-col gap-0.5 text-[11px]">
                      <span>[ -1 ]</span><span>[  2 ]</span><span>[  0 ]</span>
                    </div>
                  </div>
                  <span className="text-xl text-slate-500 font-bold">+</span>
                  <div className="p-3 bg-slate-900 border border-rose-800/80 rounded-lg text-rose-300">
                    <span className="text-[10px] text-rose-400/80 block mb-1 font-sans">Lattice Noise e</span>
                    <div className="flex flex-col gap-0.5 text-[11px]">
                      {noiseVector.slice(0, 3).map((n, idx) => (
                        <span key={idx}>[{n >= 0 ? `+${n}` : n}]</span>
                      ))}
                    </div>
                  </div>
                  <span className="text-xl text-slate-500 font-bold">=</span>
                  <div className="p-3 bg-slate-900 border border-emerald-700 rounded-lg text-emerald-300">
                    <span className="text-[10px] text-emerald-400 block mb-1 font-sans">Public Key (b)</span>
                    <div className="flex flex-col gap-0.5 text-[11px] font-bold">
                      <span>[ 153 ]</span><span>[ 081 ]</span><span>[ -51 ]</span>
                    </div>
                  </div>
                </div>
                <p className="text-xs text-slate-400 max-w-xl mx-auto font-sans">
                  Without knowing secret <code className="text-amber-400">s</code> and noise <code className="text-rose-400">e</code>, quantum computers cannot solve for <code className="text-amber-400">s</code> because lattice grid vectors obscure exact intersection points.
                </p>
              </div>
            )}

            {step === 2 && (
              <div className="w-full space-y-6 text-center z-10">
                <h3 className="text-sm font-semibold text-teal-400">Encapsulating Shared Secret & Creating Ciphertext</h3>
                <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-mono">
                  <div className="p-4 bg-slate-900 border border-slate-800 rounded-xl max-w-xs text-left">
                    <span className="text-cyan-400 font-bold block mb-1 font-sans">Sender Action:</span>
                    <p className="text-[11px] text-slate-300 font-sans">
                      1. Samples random vector <code className="text-cyan-300">r</code>.<br />
                      2. Computes ciphertext vectors <code className="text-teal-300 font-mono">u = Aᵀr + e₁</code> and <code className="text-teal-300 font-mono">v = bᵀr + e₂ + m</code>.
                    </p>
                  </div>
                  <Icon name="ArrowRight" className="w-6 h-6 text-cyan-500 animate-pulse hidden sm:block" />
                  <div className="p-4 bg-slate-900 border border-teal-800/80 rounded-xl text-emerald-300 text-left">
                    <span className="text-[10px] text-slate-400 block mb-1 font-sans">Generated Encapsulated Ciphertext (c)</span>
                    <div className="text-[11px] bg-slate-950 p-2 rounded border border-slate-800 break-all max-w-xs text-slate-300">
                      {keyPair ? keyPair.pk.substring(0, 42) + "..." : "PQ-CT768-LWE-9f28a..."}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="w-full space-y-6 text-center z-10">
                <h3 className="text-sm font-semibold text-emerald-400">Decapsulation & Shared Key Matching</h3>
                <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-mono">
                  <div className="p-4 bg-slate-900 border border-slate-800 rounded-xl max-w-xs text-left">
                    <span className="text-amber-400 font-bold block mb-1 font-sans">Receiver Action:</span>
                    <p className="text-[11px] text-slate-300 font-sans">
                      Calculates <code className="text-amber-300">v - sᵀu</code> = <code className="text-emerald-300">m + noise</code>.<br />
                      Rounds coefficients to eliminate noise and recover exact key <code className="text-cyan-400">K</code>.
                    </p>
                  </div>
                  <div className="p-4 bg-emerald-950/60 border border-emerald-700/80 rounded-xl text-center">
                    <Icon name="CheckCircle2" className="w-8 h-8 text-emerald-400 mx-auto mb-2" />
                    <span className="text-xs font-bold text-emerald-300 font-sans">Shared Secret Verified</span>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Explainer Component
    function ExplainerSection() {
      return (
        <div className="space-y-6">
          <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm">
            <h2 className="text-base font-semibold text-slate-200 mb-2 flex items-center gap-2">
              <Icon name="Info" className="w-5 h-5 text-cyan-400" />
              Post-Quantum Cryptography Architecture & NIST Standards
            </h2>
            <p className="text-xs text-slate-400 leading-relaxed max-w-4xl">
              Traditional public-key algorithms like RSA, ECDSA, and Diffie-Hellman rely on prime factorization and discrete logarithms. 
              Shor’s algorithm running on quantum computers will solve these in polynomial time. 
              Post-Quantum Cryptography (PQC) uses mathematical lattice structures that resist quantum attacks.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-3">
              <div className="w-10 h-10 rounded-xl bg-cyan-950/80 border border-cyan-800 flex items-center justify-center text-cyan-400">
                <Icon name="Cpu" className="w-5 h-5" />
              </div>
              <h3 className="text-sm font-semibold text-slate-200">ML-KEM (Module-LWE)</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Standardized in NIST FIPS 203 (formerly CRYSTALS-Kyber). Based on the hardness of Learning With Errors over module lattices.
              </p>
            </div>

            <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-800 flex items-center justify-center text-emerald-400">
                <Icon name="Shield" className="w-5 h-5" />
              </div>
              <h3 className="text-sm font-semibold text-slate-200">Hybrid Architecture</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Combines PQC Key Encapsulation (ML-KEM-768) with AES-256-GCM symmetric encryption for high-speed file confidentiality.
              </p>
            </div>

            <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-3">
              <div className="w-10 h-10 rounded-xl bg-amber-950/80 border border-amber-800 flex items-center justify-center text-amber-400">
                <Icon name="AlertTriangle" className="w-5 h-5" />
              </div>
              <h3 className="text-sm font-semibold text-slate-200">"Harvest Now, Decrypt Later"</h3>
              <p className="text-xs text-slate-400 leading-relaxed">
                Prevents adversaries from storing encrypted network traffic today to decrypt once quantum hardware arrives in the future.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
